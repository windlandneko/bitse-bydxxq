[project]
name = "charging-platform-ml"
version = "0.1.0"
description = "机器学习智能分析子系统：电动汽车充电桩负荷预测（UC-M）"
requires-python = ">=3.10"
dependencies = [
    "chinese-calendar>=1.11.0",
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ['..']
testpaths = ['tests']

[tool.ruff]
indent-width = 2
line-length = 100

[tool.ruff.format]
quote-style = 'single'
