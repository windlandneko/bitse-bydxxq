[project]
name = "charging-platform-ml"
version = "0.1.0"
description = "机器学习智能分析子系统：电动汽车充电桩负荷预测（UC-M）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
# This project runs the package directly from the repository root.  The
# pyproject lives in ml/ only to provide an isolated dependency environment;
# treating ml/ as an installable package would look for ml/ml/.
package = false
