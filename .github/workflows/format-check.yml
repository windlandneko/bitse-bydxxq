name: C++ formatting

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: ./scripts/format-cpp.sh --check
